name: Unpack artifacts

on:
  push:
    paths:
      - '**/*.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        run: |
          if [ -f SarvamV.apk.gz.b64 ] && [ -f editor.html.gz.b64 ]; then
            gunzip -c SarvamV.apk.gz.b64 > SarvamV.apk
            gunzip -c editor.html.gz.b64 > editor.html
            echo "b87f5bb265b30c9bf62c6d0e85fcfdc84ab8b739c8619ac33ce124ce975b0db0  SarvamV.apk" | sha256sum -c -
            echo "867f6fec0646f59c24ceb721498b7b2e2a392e5a935207b29e4ec032c41ac136  editor.html" | sha256sum -c -
            git config user.name "sarvam-v-bot"
            git config user.email "actions@github.com"
            git rm -q SarvamV.apk.gz.b64 editor.html.gz.b64
            git add SarvamV.apk editor.html
            git commit -m "release: unpack SarvamV.apk and editor.html"
            git push
          else
            echo "Waiting for all parts..."
          fi
